<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-64.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <title>Animegent</title>
    <script>
      // 在 React 渲染前应用深色模式和语言，避免页面先白后黑地闪一下
      (function () {
        try {
          var saved = localStorage.getItem("anidaily-dark");
          var dark = saved !== null ? saved === "true" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
          if (localStorage.getItem("anidaily-lang") === "en") document.documentElement.lang = "en";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
